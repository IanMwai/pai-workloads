[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pai-workloads"
version = "0.1.0"
description = "GPU workloads to measure under the PAI hardware power pipeline"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
nhpp-load = "pai_workloads.nhpp_load:main"

[tool.setuptools]
packages = ["pai_workloads"]
